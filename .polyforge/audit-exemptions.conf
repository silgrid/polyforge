# Dependency-audit exemption ledger (workflows/_shared/scripts/audit-deps; row grammar in
# docs/reference/config.md, ".polyforge/audit-exemptions.conf").
# exempt=<advisory>|<package>|<reason>|<owner-ruling>|<from>|<expires>
#
# Baseline rows: the high/critical findings of this repository's trees when the
# gate was introduced, recorded under test/testdata/audit/baseline/;
# test/w320_baseline_coverage_test.go checks that every recorded finding has a
# valid row (later owner-ruled rows may be added). Each expires at most 90 days
# after it took effect; a renewal needs a new owner ruling.

# npm: webui/
exempt=GHSA-587h-7wmj-h5pm|vite|webui dev-build tool (vite) high advisory present when the gate was introduced; fix ticket suggested (vite upgrade)|owner-ruling 2026-11-04 baseline|2026-11-04|2027-02-01

# Go module (govulncheck, symbol mode). The go1.26.4 toolchain's 16 stdlib
# baseline rows were removed on 2026-11-11 when the toolchain pin (Dockerfile.verify,
# go.mod's toolchain line) moved to go1.26.11, which fixes every one of them.
