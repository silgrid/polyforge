# The lane's mechanical merge rules: the sync script (develop's and micro's
# sync step) and the revert script (the integration lane's revert) read them
# through the step scripts' library
# (workflows/_shared/scripts/pfstep/gitmerge/conf.py), as the default branch
# carries this file. docs/upgrade.md is append-only,
# its sha256 pin moves with it, and the pin's comment keeps one line per
# appended section between its markers (each append adds one line at the end
# of that list).
append_only=docs/upgrade.md
pin=docs/upgrade.md test/w254_docs_set_acceptance_test.go
list=test/w254_docs_set_acceptance_test.go // upgrade-sections:begin upgrade-sections:end
