# Declarative verification-scope override for this repository.
# The release-shipped workflows/_shared/scripts/verify-scope reads this file; it is never
# shell-evaluated. One key per line, comments and blank lines ignored.
#
# This repo's stack, acceptance harness, fast gates, full tail, forced-full
# paths and Go spanning roots. The zero-config defaults would be conservative;
# these lines reproduce the repository's long-standing tier definition.
# The develop lane's light tier (`--light`) applies none of the
# forced-full paths or the spanning rule below: it runs the fast gates and
# the affected packages' tests here, plus pi-web's own light report at its
# nested root (pi-web/.polyforge/verify-scope.conf); the full tail and the
# forced-full paths are the full tier's — the integration run's.
stack=go
go_harness=test/e2e-parallel.sh

# The console SPA build is the FIRST fast gate: the
# go:embed dist tree must exist before any go build, and a webui/
# change forces the full tier below (on the light tier this build is its
# check).
fast_gate=cd webui && npm ci && npm run build

fast_gate=GOWORK=off go build ./...
fast_gate=GOWORK=off go vet ./...
# gofmt lists tracked .go files only: pi-web/node_modules is
# untracked and may ship stray .go files; pi-web/go.mod ends the root module
# there, so the go build/vet gates never walk it either.
fast_gate=test -z "$(gofmt -l $(git ls-files '*.go'))"
fast_gate=python3 -I docs/design/polyforge-vnext/tools/check-xrefs.py
fast_gate=GOWORK=off GOOS=darwin GOARCH=arm64 go build -trimpath ./...
fast_gate=GOWORK=off GOOS=darwin GOARCH=amd64 go build -trimpath ./...
# The workflow step scripts' type check: pf CI's
# python-types job, the same command, strictness and scope
# (.github/workflows/pf-ci.yml; test/w528_mypy_gate_test.go reads it from
# there). A fast gate, so the light and the full tier both run it — a type
# error is red before a merge, not on main afterwards. It needs mypy
# (>=1.20,<2, CI's range) importable by python3: without it the gate fails
# loudly, it is never skipped. The verification image ships it.
fast_gate=cd workflows/_shared/scripts && python3 -m mypy --strict --python-version 3.9 pfstep tests *.py
# That gate's tool is this repository's host prerequisite:
# the fast gate runs on the host too (build's fast checks, review's host
# replay, the micro lane), and nothing else puts mypy there. Declared here
# so `pf doctor`'s "host prerequisites" row probes it under the step PATH
# and, when it is missing, names this install line. The range is the one
# pf CI installs (.github/workflows/pf-ci.yml, "mypy>=1.20,<2") and holds
# the verification image's pin (.polyforge/Dockerfile.verify, mypy==1.20.2).
# Declaring it changes no tier: without mypy the gate above still fails red.
host_requires=mypy|python3 -m mypy --version|pip3 install --user --break-system-packages "mypy>=1.20,<2"

# The full tail is the Makefile's test target split into its two
# commands (the webui build it depends on is the first fast gate), so a
# pre-existing failure can be excluded from the one command that carries
# it: the unit packages (excluded with go test's -skip), then the
# acceptance harness (excluded with E2E_SKIP). The inner `go list` carries
# its own GOWORK=off: a prefix assignment never reaches a command
# substitution, and a go.work above the clone would break the listing.
full_command=GOWORK=off go test $(GOWORK=off go list ./... | grep -v '/test$') -count=1
# The daemon package once more, under the race detector: a
# new data race there fails the full bar instead of landing silently (a
# daemon/ change forces the full tier, below — on the full tier only: the
# light tier runs the daemon package's tests without -race, and this line
# runs in the integration run). Wall time: 210-226 s on a 32-core host;
# -timeout 30m lifts go test's 10 m package default for smaller hosts and
# the 2-core CI runner.
full_command=GOWORK=off go test -race -count=1 -timeout 30m ./internal/polyforge/daemon/
full_command=GOWORK=off sh test/e2e-parallel.sh
# The pi-web package's bar (the union of both repositories'
# bars), run from its own directory: install, lint, typecheck, unit tests,
# every e2e suite (w216 builds this repository's pf from ./cmd/pf). A
# pi-web/ path forces the full tier below; on the light tier it does not, and
# pi-web is verified by its nested root's light report instead (its fast
# gates and the suites whose carries: meet the change).
full_command=cd pi-web && npm ci
full_command=cd pi-web && npm run lint
full_command=cd pi-web && node_modules/.bin/tsc --noEmit
full_command=cd pi-web && npm test
# The e2e bar runs in build-once mode (pi-web/e2e/README.md
# "Build-once mode"): E2E_SERVER_MODE=start makes the runner build pi-web once
# and run every browser suite on `next start` instead of its own `next dev`.
# This line is a `cd … &&` list, not one simple command, so the bar cannot
# derive a targeted re-run from it; the rerun= line below declares one:
# a red suite is re-run alone, the way the runner's own
# `re-run:` line names it, and on the baseline the same way. It binds the
# anonymous name full-8 (this phase's eighth line): a full_command= line
# inserted above this one moves it, which test/w403_light_engine_test.go
# catches.
full_command=cd pi-web && E2E_SERVER_MODE=start npm run test:e2e:all
rerun=full-8|cd pi-web && E2E_SERVER_MODE=start npm run test:e2e:all -- {unit}

# A throwaway base worktree needs the go:embed dist tree before any Go
# test there builds (the bar proves a pre-existing failure on the base),
# and pi-web's node_modules before a pi-web suite re-runs there
# (the light tier re-runs a red suite on the baseline).
base_setup=cd webui && npm ci && npm run build
base_setup=cd pi-web && npm ci

forced_full=go.mod
forced_full=go.sum
forced_full=Makefile
forced_full=.polyforge
forced_full=.polyforge/*
forced_full=internal/polyforge/driver
forced_full=internal/polyforge/driver/*
forced_full=internal/polyforge/daemon
forced_full=internal/polyforge/daemon/*
forced_full=test/main_test.go
forced_full=test/e2e-parallel.sh
forced_full=test/fakepi
forced_full=test/fakepi/*
forced_full=webui
forced_full=webui/*
# The merged pi-web package: a pi-web/ change runs the full
# tier on the full and scoped tiers. The light tier ignores these globs (like
# every forced_full= line): pi-web/.polyforge/verify-scope.conf answers for
# the change at its nested root.
forced_full=pi-web
forced_full=pi-web/*

module_root=cmd
module_root=internal/aihub
module_root=internal/polyforge
module_root=internal/common

# The micro lane: a text-only change confined to the docs
# below may take the micro lane. The top-level docs are listed file by file
# because docs/*.md would also take docs/upgrade.md, which is append-only and
# sha256-pinned; the design directory's *.md never reaches its tools/ (the
# xrefs fast gate). docs/contributing.md ("Verification tiers") names every
# docs path left out and why.
micro_path=docs/architecture.md
micro_path=docs/bundles.md
micro_path=docs/concepts.md
micro_path=docs/contributing.md
micro_path=docs/extending.md
micro_path=docs/install.md
micro_path=docs/quickstart-developers.md
micro_path=docs/quickstart-macos.md
micro_path=docs/user-guide.md
micro_path=docs/zh.md
micro_path=docs/reference/*.md
micro_path=docs/design/polyforge-vnext/*.md
micro_path=docs/design/polyforge-vnext/archive/*.md
# The micro evidence runs, after the fast gates, the contract tests that read
# those docs (well under a minute in all; about 35 s measured on a
# 32-core host, slower on smaller ones), so a micro change that breaks a pinned
# sentence fails its own evidence instead of the integration run's full bar.
# A new test that reads one of these docs, or a new docs directory, joins
# these lines. The fork contract tests are selected as one prefix: these
# lines are projected, and a name spelled out here must pass the
# projection's identifier check.
micro_check=GOWORK=off go test ./internal/common/workflow/ ./internal/polyforge/cli/ ./internal/polyforge/driver/ -run '^(TestReferenceDocMatchesTheRegistry|TestDocsSetNoDrift|TestDocsConceptsCarriesSixteenTerms|TestHelpExtensionsIndexesTheExtendingSubsections|TestStatusRetryFieldsDocumented|TestCountedFailureItemKeepsTheLatterNextToItsSubject|TestUserGuideNoDrift|TestDocsBundleExampleLoadsThroughTheDaemonPath|TestW371TextContract|TestW394TextContract)$' -count=1
micro_check=GOWORK=off go test ./test/ -run '^(TestFork.*|TestLaneRuleTextsContract|TestOwnerReviewDocsNameTheGate|TestProjectDeleteDocsCover|TestW079NoRestartTeachingNearYamlMentions|TestW103S2[01].*|TestW105DocumentsDescribeTheConsoleAndReachability|TestW113DesignDocsTeachMappingContract|TestW123RecallBrowseReachabilityDocumented|TestW152FollowUpFragmentContract|TestW167CoupledDocsStateFieldsAndTrust|TestW218Readme.*|TestW241(Guide|HelpExtensions|SkillHelp|Readme).*|TestW254.*|TestW256.*|TestW25E2EGenericDefaultsAndDocs|TestW294DoctorDocsTeachSVGGuidance|TestW33NoDocKeepsClaimTimeFreeze|TestW344E2EInstallOptIn|TestW374DevelopDriverChecksContract|TestW3InstallAndDocsThroughPFConfig|TestW403DevelopGrillAndE2EContract|TestW433UserLaneFromTheReferenceRunsToTheEnd|TestW460.*|TestW58GrillAttentionContract|TestW20PolyforgeTierDocsAndProjection)$' -count=1
