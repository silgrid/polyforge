# The rebuildable build products of this repository (polyforge#127):
# the directories a `pf doctor --prune-rebuildables` run may remove from
# a terminal work item's capsule clones — rebuildable by the
# repository's own fast gates (pi-web's install and build), ignored by
# git, holding no evidence a work item's audit needs. Anything else
# needs its own per-item proof before it joins this list (the owner's
# first-batch ruling of 2026-11-18).
rebuild_dir=pi-web/.next
rebuild_dir=pi-web/node_modules
