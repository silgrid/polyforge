# Declarative verification-scope override for this repository.
#
# Since pi-web joined the Polyforge repository this file is
# the pi-web subtree's engine conf: it applies when the engine runs with
# `cd pi-web` (the subtree as its own npm root). The merged repository's
# root .polyforge/verify-scope.conf forces the full tier for every pi-web/
# path and runs this package's bar (npm ci, lint, tsc, npm test,
# test:e2e:all) in its full tail, so no full- or scoped-tier run of the
# repository under-verifies a pi-web change. The develop lane's light tier
# does: it applies no forced-full path, and a pi-web change
# runs only this file's light report — the npm fast gates and the suites
# whose carries: meet the change, through e2e_runner= — so a red elsewhere in
# the package is left to the integration run's full bar.
#
# The release-shipped workflows/_shared/scripts/verify-scope reads this file; it is never
# shell-evaluated. One key per line; comments and blank lines are ignored.
#
# The npm analyzer derives the fast gates from package.json: `npm ci` only
# when node_modules/ is absent, then `npm run lint`, `node_modules/.bin/tsc
# --noEmit` and `npm test`. The lines below declare only what is
# repository-specific: the forced-full paths, the one full-tier exclusion and
# the full-tier command (one parallel runner, e2e/all.mjs, instead of the
# engine's serial one-command-per-suite tail).
#
# Scoped e2e selection is by each suite's `// carries:` header. e2e_runner=
# names the same parallel runner for the selected suites: the engine appends
# them, repository-relative and in stable order, to this prefix as one command
# (e2e/all.mjs accepts that subset), and e2e/all.mjs itself is the runner,
# never a suite.

stack=npm
forced_full=.polyforge
forced_full=.polyforge/*
forced_full=next.config.ts
forced_full=patches
forced_full=patches/*
forced_full=eslint.config.*
forced_full=.eslintrc*
exclude=themes.mjs
# Build-once mode (e2e/README.md "Build-once mode"): the full
# bar builds once and runs every browser suite on `next start`; the bar
# carries the leading assignment into each targeted re-run. e2e_runner= stays
# unprefixed (selected suites run on `next dev`): the engine recognizes the
# runner file only in a value that begins `npm run <script>`, and a prefixed
# value would leave e2e/all.mjs an undeclared suite that forces the full tier.
full_command=E2E_SERVER_MODE=start npm run test:e2e:all
e2e_runner=npm run test:e2e:all --

# The full-tier e2e selection opt-in: declaring smoke suites is the opt-in.
# Full-tier verification then runs the fast gates plus the carries-selected
# suites union these smoke suites through e2e_runner= (only the smoke suites
# for a documentation-only diff), and falls back to full_command= on a
# forced-full path, a change to this conf or a structural diagnostic.
# full_command= (with e2e_runner=) stays the full bar: it is the e2e command
# carried to delivery, which deliver re-runs. The scoped tier ignores these.
smoke_suite=e2e/run.mjs
smoke_suite=e2e/polyforge.mjs
smoke_suite=e2e/polyforge-cards.mjs
smoke_suite=e2e/polyforge-messages.mjs
smoke_suite=e2e/polyforge-workflow-216.mjs
smoke_suite=e2e/polyforge-config-layout.mjs

# the verification bar proves a pre-existing e2e failure by re-running the failing suite
# in a throwaway worktree of the base commit; that tree has no node_modules, so
# install first (postinstall runs patch-package + prepare-terminal). Without this
# line nothing in this repo can ever be classified pre-existing (fail closed).
base_setup=npm ci
