# aihub-interface-paths.conf — the client-server interface path list
# of the local development channel (polyforge#188). tools/install.sh
# --dev refuses, in its prepare phase and before anything on the
# machine changes, when the diff «latest formal release tag..latest
# green-tag commit» touches any path this file names: these are the
# wire contracts between the local pf and the two AIHubs — a dev
# install must never pair a new client with the old server over a
# changed interface. Every other AIHub-side change is judged by the
# adjacent total list (tools/aihub-paths.conf) and passes with one
# WARN naming the hit paths. The installer reads this file from the
# green commit's checkout and the tests read the same file from the
# repository — one list, both readers (never a second copy); a list
# that is missing, unreadable, empty or of an unsupported shape
# refuses the install (fail closed): the installer waits for a green
# tag that carries the list.
#
# One entry per line; blank lines and # comments are ignored. An entry
# ending in /** covers that directory and everything under it (a path
# matches when it carries the prefix «<dir>/»); any other entry is one
# exact path. First-version scope (the ticket's conservative list):
# the two shared wire-contract packages. This is a conservative path
# rule, not a compatibility proof: server-side changes outside these
# paths can still behave differently, which is why the rest of the
# AIHub-side diff warns and names its paths instead of passing
# silently.
internal/common/api/**
internal/common/protocol/**
