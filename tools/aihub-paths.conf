# aihub-paths.conf — the AIHub-side path list of the local development
# channel (polyforge#136). tools/install.sh --dev refuses, in its prepare
# phase and before anything on the machine changes, when the diff
# «latest formal release tag..latest green-tag commit» touches any path
# this file names: those changes need the two AIHubs deployed and a real
# release, not a local dev install whose daemon would talk to the old
# server. The installer reads this file from the green commit's checkout
# and the tests read the same file from the repository — one list, both
# readers (never a second copy).
#
# One entry per line; blank lines and # comments are ignored. An entry
# ending in /** covers that directory and everything under it (a path
# matches when it carries the prefix «<dir>/»); any other entry is one
# exact path. First-version scope (the ticket's conservative list): the deploy
# tree, the server and its SQL, the two shared wire-contract packages,
# and the deploy entry point.
deploy/**
internal/aihub/**
internal/common/api/**
internal/common/protocol/**
.polyforge/deploy.sh
