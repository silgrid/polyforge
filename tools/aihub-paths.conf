# aihub-paths.conf — the AIHub-side path list of the local development
# channel (polyforge#136). tools/install.sh --dev reads it in its
# prepare phase, before anything on the machine changes, when it judges
# the diff «latest formal release tag..latest green-tag commit»:
# a path this file names that the adjacent interface list
# (tools/aihub-interface-paths.conf) also names refuses (a changed
# client-server wire contract needs a formal release — the interface
# list is judged first and on its own, never filtered through this
# file); every OTHER path this file names passes with one WARN that
# names the hit — those changes need the two AIHubs deployed and a
# real release, not a local dev install whose daemon would talk to
# the old server, and the two AIHubs stay on their formal releases
# until then. The installer reads this file from the green commit's
# checkout and the tests read the same file from the repository —
# one list, both readers (never a second copy).
#
# One entry per line; blank lines and # comments are ignored. An entry
# ending in /** covers that directory and everything under it (a path
# matches when it carries the prefix «<dir>/»); any other entry is one
# exact path. First-version scope (the ticket's conservative list): the deploy
# tree, the server and its SQL, the two shared wire-contract packages
# (the refuse-grade subset of those two lives in the interface list),
# and the deploy entry point.
deploy/**
internal/aihub/**
internal/common/api/**
internal/common/protocol/**
.polyforge/deploy.sh
