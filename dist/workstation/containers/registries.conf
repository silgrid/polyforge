# dist/workstation/containers/registries.conf — short-name resolution
# for the workstation's podman (polyforge#161): the engine probes and
# Dockerfile.verify's FROMs use short names (busybox:1.37, golang:…,
# node:…, ubuntu:24.04), and without an unqualified-search list podman
# stops to ask instead of pulling — every engine-gated test would skip.
unqualified-search-registries = ["docker.io"]
