# dist/workstation/containers/storage.conf — podman's storage inside the
# workstation (polyforge#161). Native overlay on the storage volume
# compose mounts at /var/lib/containers/storage: the driver refuses
# overlay-on-overlay (the container's own root is overlayfs), so the
# graphroot must be that separate volume — a host ext4/xfs filesystem
# through the named volume, measured to build and run at full speed.
[storage]
driver = "overlay"
graphroot = "/var/lib/containers/storage"
runroot = "/run/containers/storage"
