# dist/workstation/containers/containers.conf — the workstation's podman
# semantics (polyforge#161).
[containers]
# the entrypoint initialized a private, writable cgroup namespace; the
# systemd manager has no bus in there. cgroupfs lets podman create its
# container groups below the namespace root, which the entrypoint
# emptied before enabling the controllers.
cgroup_manager = "cgroupfs"
# file, not journald: the workstation container has no systemd journal.
events_logger = "file"
# The outer pinned seccomp (moby's default template + pivot_root) does
# not allow add_key, so a container-side session keyring fails with
# EPERM at crun's create (measured). No keyring at all: the workstation
# needs none, and podman passes conmon --no-new-keyring — the build
# path gets the same guarantee from PodmanCLI's generated crun wrapper
# (#159, this repo's engine client).
keyring = false
