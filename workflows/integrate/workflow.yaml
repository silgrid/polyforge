# yaml-language-server: $schema=../_schema/workflow-1.schema.json
contract: 1
name: integrate
description: The integration lane - one work item per batch. The develop lane merges every work item into the default branch itself and wraps it landed; this lane only gates what landed. Six agent steps - collect pins each repo's default branch and takes the landed items those heads carry (it reads the project's pool through the step's hub; a hold nothing can release is put to the owner, whose word alone clears one), repair and its review run only after a rewind covers them (rewind_only; the gate's red hands the batch back over units every one of which is attributed and fixable by touching only tests or documentation - the repair fixes them on one local branch per repo off the pinned heads and its review judges the branch; the landing is the revert step's, under the merge lock), revert carries out the reverts the owner ruled and lands the repair branches the same way, writing the gate's pins after both, full-gate runs the release's full test gate once on the pinned heads - a pass tags the green head green/<YYYYMMDD>-<n> - and a red it cannot hand back to the repair goes down to one fix ticket per root cause (a revert the owner rules is gated again in the same batch), close moves every landed item a green tag covers to merged and registers the batch's record for the wrap. Started only by a person, with `pf file create --bundle integrate` and `pf submit`; the lane is exclusive, so aihub holds every project to one unfinished batch.
max_rewinds: 3
exclusive: true
acceptance: none
defaults:
  model_candidates: [pi:example-claude/claude-opus-5, pi:example-gateway/model-a]
  tiers: { cheap: [pi:example-gateway/model-cheap], mid: [pi:example-gateway/model-mid] }
steps:
  - id: collect
    skill: collect
    model_tier: mid
    budget: { wall_minutes: 20, tool_minutes: 10 }
    hub: { verbs: [get, list, batch, file], attrs: [integration, integration_fix] }
  - id: repair
    skill: repair
    rewind_only: true
    budget: { wall_minutes: 60, tool_minutes: 45 }
  - id: review
    gate: true
    on_fail: { target: repair }
    rewind_only: true
    budget: { wall_minutes: 30, tool_minutes: 20 }
  - id: revert
    skill: revert
    model_tier: cheap
    budget: { tool_minutes: 20 }
    resources: { locks: [merge] }
    hub: { verbs: [get, batch], attrs: [integration] }
  - id: full-gate
    gate: true
    on_fail: { target: repair }
    skill: full-gate
    budget: { wall_minutes: 150, tool_minutes: 90 }
    resources: { admission: heavy }
    # the step's `image` parameter (polyforge#64), default empty: an empty
    # value keeps each repo's own .polyforge/Dockerfile.verify (required
    # then, a tree without one is not judged); a value names a prepared
    # image that gates every repo — one image for the project's every
    # container repo, Dockerfile or not. The project sets
    # steps.<project>.full-gate.params.image, a ticket overrides it with
    # `pf override`; the value reaches gate.py as PF_PARAM_IMAGE.
    params: { image: "" }
    hub: { verbs: [get, list, batch, file], attrs: [integration, integration_fix] }
  - id: close
    skill: close
    model_tier: cheap
    budget: { wall_minutes: 15, tool_minutes: 10 }
    hub: { verbs: [get, list, batch], attrs: [integration] }
    wrap_attrs: [integration_batch]
